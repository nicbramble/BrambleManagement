<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synker AI Race - Final</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --grid-size: 21;
      --wall-color: #0f172a; 
      --path-bg: #f1f5f9;
    }

    body {
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at 50% 50%, #eef2ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      touch-action: none;
      overflow: hidden; /* Prevent body scroll */
    }

    /* Glass Card Container */
    .glass-card {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
    }

    /* Maze Grid */
    .maze-container {
      background: var(--wall-color);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .maze-cell {
      background-color: var(--path-bg);
      position: relative;
      transition: background-color 0.1s;
    }
    
    .maze-cell.wall { background-color: var(--wall-color); }

    /* Start/Finish Markers */
    .maze-cell.start::after,
    .maze-cell.finish::after {
      content: "";
      position: absolute;
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      border-radius: 6px;
    }
    .maze-cell.start::after { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
    .maze-cell.finish::after { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .maze-cell.finish { background-color: #d1fae5 !important; }

    /* Neon Trails */
    .trail-human { 
      background-color: #f87171 !important; 
      box-shadow: inset 0 0 0 2px #ef4444; 
    }
    .trail-ai { 
      background-color: #34d399 !important; 
      box-shadow: 0 0 10px #10b981; 
      z-index: 5; 
    }

    /* Avatar */
    .avatar {
      width: calc(100% / var(--grid-size));
      height: calc(100% / var(--grid-size));
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      pointer-events: none;
      transition: transform 0.1s linear; 
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-body {
      width: 85%;
      height: 85%;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 2px solid white;
    }
    .avatar-human .avatar-body { background: #dc2626; }
    .avatar-ai .avatar-body { background: #059669; box-shadow: 0 0 15px #10b981; }

    /* Eyes */
    .eye {
      width: 25%;
      height: 25%;
      background: white;
      border-radius: 50%;
      position: relative;
    }
    .pupil {
      width: 50%;
      height: 50%;
      background: black;
      border-radius: 50%;
      position: absolute;
      top: 25%;
      left: 25%;
      transition: transform 0.1s;
    }

    /* Overlays */
    #countdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.9);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      font-weight: 900;
      color: #0f172a;
      border-radius: 12px;
      pointer-events: none; 
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #countdown-overlay.active { opacity: 1; pointer-events: auto; }

    /* Mobile Controls */
    .control-btn {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 0 #cbd5e1;
      touch-action: none; 
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      transition: transform 0.05s, box-shadow 0.05s, background-color 0.05s;
    }
    .control-btn:active, .control-btn.pressed {
      transform: translateY(4px);
      box-shadow: 0 0 0 #cbd5e1;
      background: #e2e8f0;
    }

    /* CTA Banner */
    .cta-banner {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      border-top: 1px solid #cbd5e1;
      border-radius: 0 0 24px 24px;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <div class="max-w-4xl w-full mx-auto">
    <div class="glass-card relative">
      
      <div class="p-4 sm:p-6 pb-2">
        <header class="flex justify-between items-end mb-5">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Race Synker AI</h1>
            <p class="text-xs text-slate-500 font-bold mt-1 uppercase tracking-wider">Hold arrow keys to run</p>
          </div>
          <div class="text-right">
             <div id="timer" class="text-3xl font-black text-slate-800 tabular-nums">0.00s</div>
             <div class="text-[10px] font-bold text-slate-400 uppercase">Your Time</div>
          </div>
        </header>

        <div class="flex flex-col md:flex-row gap-6">
          
          <div class="flex-1 relative">
            <div id="countdown-overlay" class="hidden">3</div>
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 px-1">
              <span class="flex items-center gap-2"><span class="w-3 h-3 bg-red-600 rounded-full"></span> YOU</span>
            </div>
            <div id="human-maze" class="maze-container aspect-square grid"></div>

            <div id="dpad" class="md:hidden grid grid-cols-3 gap-2 w-48 mx-auto mt-4 h-32">
              <div></div>
              <button class="control-btn" data-key="ArrowUp"><svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><path d="m18 15-6-6-6 6"/></svg></button>
              <div></div>
              <button class="control-btn" data-key="ArrowLeft"><svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><path d="m15 18-6-6 6-6"/></svg></button>
              <button class="control-btn" data-key="ArrowDown"><svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><path d="m6 9 6 6 6-6"/></svg></button>
              <button class="control-btn" data-key="ArrowRight"><svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </div>

          <div class="flex-1">
            <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 px-1">
              <span class="flex items-center gap-2"><span class="w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_8px_#10b981]"></span> SYNKER AI</span>
              <span id="ai-timer" class="text-emerald-600">0.00s</span>
            </div>
            <div id="ai-maze" class="maze-container aspect-square grid opacity-60 grayscale transition-all duration-500"></div>
            <div class="mt-6 space-y-3">
              <button id="btn-start" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl shadow-lg hover:bg-slate-800 active:scale-95 transition-all">Start Race</button>
              <button id="btn-reset" class="hidden w-full py-3.5 bg-white text-slate-700 border border-slate-200 font-bold rounded-xl hover:bg-slate-50 active:scale-95 transition-all">New Maze</button>
            </div>
          </div>

        </div>
      </div>

      <div class="cta-banner p-6 mt-4 text-center">
        <p class="text-slate-600 font-medium text-sm sm:text-base mb-3">
          Synker: AI Shift Scheduling for you!
        </p>
        <a href="https://synker.co" target="_blank" class="inline-flex items-center justify-center gap-2 text-indigo-600 font-bold text-sm hover:text-indigo-800 transition-colors">
          Visit Synker.co <span aria-hidden="true">&rarr;</span>
        </a>
      </div>

    </div>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
      <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl transform transition-all scale-95">
        <div class="mx-auto w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-4 text-3xl">🚀</div>
        
        <h3 id="modal-title" class="text-2xl font-extrabold text-slate-900 mb-2"></h3>
        
        <div class="bg-slate-50 rounded-lg p-4 mb-6 grid grid-cols-2 gap-4 border border-slate-100">
          <div>
            <p class="text-xs uppercase text-slate-500 font-bold">You</p>
            <p id="modal-human-time" class="text-xl font-bold text-slate-700">0.00s</p>
          </div>
          <div>
            <p class="text-xs uppercase text-slate-500 font-bold">Synker AI</p>
            <p id="modal-ai-time" class="text-xl font-bold text-emerald-600">0.00s</p>
          </div>
        </div>

        <p class="text-slate-700 font-medium text-lg leading-relaxed mb-6">
          If Synker is that fast at solving puzzles, imagine how quick it will be at building your schedule.
        </p>
        
        <div class="space-y-3">
          <a href="https://synker.co/demo" target="_blank" class="block w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
            Book a Demo
          </a>
          <button id="modal-close" class="block w-full py-3.5 text-slate-500 font-bold hover:text-slate-800 hover:bg-slate-50 rounded-xl transition-colors">
            Play Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Configuration ---
    const CONFIG = {
      gridSize: 21,
      moveRepeatDelay: 70, // Human movement smoothness
      aiDuration: 1500     // AI Total Duration target
    };

    // --- State ---
    const state = {
      grid: [],
      solution: [],
      human: { r: 1, c: 1 },
      ai: { r: 1, c: 1 },
      running: false,
      startTime: 0,
      finalTime: 0,
      inputState: { up: false, down: false, left: false, right: false, lastMoveTime: 0 }
    };

    // --- Elements ---
    const els = {
      humanMaze: document.getElementById('human-maze'),
      aiMaze: document.getElementById('ai-maze'),
      timer: document.getElementById('timer'),
      aiTimer: document.getElementById('ai-timer'),
      btnStart: document.getElementById('btn-start'),
      btnReset: document.getElementById('btn-reset'),
      overlay: document.getElementById('countdown-overlay'),
      dpad: document.getElementById('dpad'),
      modal: document.getElementById('modal'),
      modalTitle: document.getElementById('modal-title'),
      modalHumanTime: document.getElementById('modal-human-time'),
      modalAiTime: document.getElementById('modal-ai-time'),
      canvas: document.getElementById('confetti-canvas')
    };

    // --- Maze Logic ---
    function generateMaze() {
      const size = CONFIG.gridSize;
      const grid = Array.from({length: size}, () => Array(size).fill(1));
      const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
      const stack = [{r: 1, c: 1}];
      grid[1][1] = 0;

      while (stack.length) {
        const cur = stack[stack.length - 1];
        const neighbors = [];
        dirs.forEach(([dr, dc]) => {
          const nr = cur.r + dr, nc = cur.c + dc;
          if (nr > 0 && nr < size - 1 && nc > 0 && nc < size - 1 && grid[nr][nc] === 1) {
            neighbors.push({r: nr, c: nc, mr: cur.r + dr/2, mc: cur.c + dc/2});
          }
        });
        if (neighbors.length) {
          const next = neighbors[Math.floor(Math.random() * neighbors.length)];
          grid[next.mr][next.mc] = 0; 
          grid[next.r][next.c] = 0;   
          stack.push({r: next.r, c: next.c});
        } else {
          stack.pop();
        }
      }
      grid[size-2][size-2] = 0;
      return grid;
    }

    function solveMaze(grid) {
      const size = grid.length;
      const q = [{r:1, c:1, path:[]}];
      const visited = new Set(['1,1']);
      while(q.length) {
        const {r, c, path} = q.shift();
        const newPath = [...path, {r, c}];
        if(r === size-2 && c === size-2) return newPath;
        [[0,1], [0,-1], [1,0], [-1,0]].forEach(([dr, dc]) => {
          const nr = r + dr, nc = c + dc;
          if(grid[nr][nc] === 0 && !visited.has(`${nr},${nc}`)) {
            visited.add(`${nr},${nc}`);
            q.push({r: nr, c: nc, path: newPath});
          }
        });
      }
      return [];
    }

    // --- Rendering ---
    function drawMaze(el, grid) {
      el.innerHTML = '';
      el.style.gridTemplateColumns = `repeat(${CONFIG.gridSize}, 1fr)`;
      grid.forEach((row, r) => {
        row.forEach((cell, c) => {
          const div = document.createElement('div');
          div.className = `maze-cell ${cell === 1 ? 'wall' : ''}`;
          div.id = `${el.id}-${r}-${c}`;
          if(r===1 && c===1) div.classList.add('start');
          if(r===CONFIG.gridSize-2 && c===CONFIG.gridSize-2) div.classList.add('finish');
          el.appendChild(div);
        });
      });
      const avatar = document.createElement('div');
      avatar.className = `avatar ${el.id === 'human-maze' ? 'avatar-human' : 'avatar-ai'}`;
      avatar.innerHTML = `<div class="avatar-body"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div>`;
      el.appendChild(avatar);
      updateAvatarPos(el.id, 1, 1);
    }

    function updateAvatarPos(mazeId, r, c, dr = 0, dc = 0, transitionDuration = null) {
      const mazeEl = mazeId === 'human-maze' ? els.humanMaze : els.aiMaze;
      const avatar = mazeEl.querySelector('.avatar');
      
      // Sync transition for AI
      if (transitionDuration !== null) {
        avatar.style.transition = `transform ${transitionDuration}ms linear`;
      } else {
        avatar.style.transition = `transform 0.08s linear`;
      }

      const x = c * 100; 
      const y = r * 100; 
      avatar.style.transform = `translate3d(${x}%, ${y}%, 0)`;
      
      // Eyes
      if (dr !== 0 || dc !== 0) {
        avatar.querySelectorAll('.pupil').forEach(p => p.style.transform = `translate(${dc*3}px, ${dr*3}px)`);
      }
      
      // Trail
      const cell = document.getElementById(`${mazeId}-${r}-${c}`);
      if (cell) cell.classList.add(mazeId === 'human-maze' ? 'trail-human' : 'trail-ai');
    }

    // --- Game Loop ---
    function update(time) {
      if (!state.running) return;
      const elapsed = (time - state.startTime) / 1000;
      els.timer.textContent = elapsed.toFixed(2) + 's';

      if (time - state.inputState.lastMoveTime > CONFIG.moveRepeatDelay) {
        let dr = 0, dc = 0;
        if (state.inputState.up) dr = -1;
        else if (state.inputState.down) dr = 1;
        else if (state.inputState.left) dc = -1;
        else if (state.inputState.right) dc = 1;
        if (dr !== 0 || dc !== 0) {
          moveHuman(dr, dc);
          state.inputState.lastMoveTime = time;
        }
      }
      requestAnimationFrame(update);
    }

    function moveHuman(dr, dc) {
      const nr = state.human.r + dr;
      const nc = state.human.c + dc;
      if (state.grid[nr] && state.grid[nr][nc] === 0) {
        state.human = {r: nr, c: nc};
        updateAvatarPos('human-maze', nr, nc, dr, dc);
        if (nr === CONFIG.gridSize-2 && nc === CONFIG.gridSize-2) finishGame();
      }
    }

    // --- Input ---
    const setKey = (k, active) => {
      if (k === 'ArrowUp') state.inputState.up = active;
      if (k === 'ArrowDown') state.inputState.down = active;
      if (k === 'ArrowLeft') state.inputState.left = active;
      if (k === 'ArrowRight') state.inputState.right = active;
    };
    window.addEventListener('keydown', e => { if(e.key.startsWith('Arrow')) { e.preventDefault(); setKey(e.key, true); }});
    window.addEventListener('keyup', e => { if(e.key.startsWith('Arrow')) setKey(e.key, false); });
    
    const handleTouch = (e, active) => {
      if(e.cancelable && e.type === 'pointerdown') e.preventDefault();
      const btn = e.target.closest('.control-btn');
      if(btn) {
        setKey(btn.dataset.key, active);
        btn.classList.toggle('pressed', active);
      }
    };
    els.dpad.addEventListener('pointerdown', e => handleTouch(e, true));
    els.dpad.addEventListener('pointerup', e => handleTouch(e, false));
    els.dpad.addEventListener('pointerleave', e => handleTouch(e, false));
    window.addEventListener('contextmenu', e => e.preventDefault());

    // --- Logic ---
    function init() {
      state.grid = generateMaze();
      state.solution = solveMaze(state.grid);
      state.human = {r:1, c:1};
      state.running = false;
      state.inputState = {up:false,down:false,left:false,right:false,lastMoveTime:0};
      drawMaze(els.humanMaze, state.grid);
      drawMaze(els.aiMaze, state.grid);
      els.timer.textContent = "0.00s";
      els.aiTimer.textContent = "0.00s";
      els.aiMaze.classList.add('opacity-60', 'grayscale');
      els.btnStart.classList.remove('hidden');
      els.btnReset.classList.add('hidden');
      hideModal();
      els.overlay.classList.add('hidden');
      els.overlay.classList.remove('active');
    }

    function startSequence() {
      els.btnStart.classList.add('hidden');
      els.overlay.classList.remove('hidden');
      void els.overlay.offsetWidth; 
      els.overlay.classList.add('active');
      let count = 3;
      els.overlay.textContent = count;
      const int = setInterval(() => {
        count--;
        if(count > 0) els.overlay.textContent = count;
        else {
          clearInterval(int);
          els.overlay.textContent = "GO!";
          setTimeout(() => {
            els.overlay.classList.remove('active');
            els.overlay.classList.add('hidden');
            state.running = true;
            state.startTime = performance.now();
            requestAnimationFrame(update);
          }, 500);
        }
      }, 800);
    }

    function finishGame() {
      state.running = false;
      state.finalTime = (performance.now() - state.startTime) / 1000;
      els.timer.textContent = state.finalTime.toFixed(2) + 's';
      confetti();
      els.btnReset.classList.remove('hidden');
      els.aiMaze.classList.remove('opacity-60', 'grayscale');
      runAI();
    }

    function runAI() {
      const path = state.solution;
      const stepTime = Math.max(20, CONFIG.aiDuration / path.length); 
      let i = 0;
      const aiStart = performance.now();

      function step() {
        if(i >= path.length) {
          const total = (performance.now() - aiStart)/1000;
          els.aiTimer.textContent = total.toFixed(2) + 's';
          showModal(total);
          return;
        }
        const p = path[i];
        let dr = 0, dc = 0;
        if(i > 0) { dr = p.r - path[i-1].r; dc = p.c - path[i-1].c; }
        
        updateAvatarPos('ai-maze', p.r, p.c, dr, dc, stepTime);
        els.aiTimer.textContent = ((performance.now() - aiStart)/1000).toFixed(2) + 's';
        i++;
        setTimeout(step, stepTime);
      }
      step();
    }

    function showModal(aiTime) {
      const speedup = (state.finalTime / Math.max(aiTime, 0.01)).toFixed(1);
      els.modalTitle.innerHTML = `Synker is <span class="text-emerald-600">${speedup}x Faster</span>`;
      els.modalHumanTime.textContent = state.finalTime.toFixed(2) + 's';
      els.modalAiTime.textContent = aiTime.toFixed(2) + 's';
      
      els.modal.classList.remove('hidden');
      // Small delay to allow CSS transition
      requestAnimationFrame(() => {
        els.modal.classList.remove('opacity-0');
        els.modal.querySelector('div').classList.remove('scale-95');
        els.modal.querySelector('div').classList.add('scale-100');
      });
      els.modal.classList.add('flex');
    }

    function hideModal() {
      els.modal.classList.add('opacity-0');
      els.modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        els.modal.classList.add('hidden');
        els.modal.classList.remove('flex');
      }, 300);
    }

    function confetti() {
      const ctx = els.canvas.getContext('2d');
      els.canvas.width = window.innerWidth;
      els.canvas.height = window.innerHeight;
      const p = Array.from({length:80}, () => ({
        x: window.innerWidth/2, y: window.innerHeight/2,
        vx: (Math.random()-0.5)*25, vy: (Math.random()-1)*25,
        c: ['#f00','#0f0','#00f','#ff0'][Math.floor(Math.random()*4)],
        s: Math.random()*6+3
      }));
      function tick() {
        ctx.clearRect(0,0,els.canvas.width,els.canvas.height);
        let active = false;
        p.forEach(k => {
          k.x+=k.vx; k.y+=k.vy; k.vy+=0.6; k.s*=0.95;
          if(k.s>0.5) { active=true; ctx.fillStyle=k.c; ctx.fillRect(k.x,k.y,k.s,k.s); }
        });
        if(active) requestAnimationFrame(tick);
      }
      tick();
    }

    els.btnStart.addEventListener('click', startSequence);
    els.btnReset.addEventListener('click', init);
    document.getElementById('modal-close').addEventListener('click', init);
    
    // Initialize
    init();
  </script>
</body>
</html>
